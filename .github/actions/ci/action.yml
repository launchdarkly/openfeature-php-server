name: CI Workflow
description: 'Shared CI workflow.'
inputs:
  php-version:
    description: 'Which version of PHP should we setup?'
    required: false
    default: "8.2"
  token:
    description: 'Token used to prevent composer rate limiting'
    required: true

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: ${{ inputs.php-version }}
        tools: phpdoc:3.1.2
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Install dependencies
      shell: bash
      run: composer install --no-progress

    - name: Run quality control checks
      shell: bash
      run: make check
